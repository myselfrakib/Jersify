<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Standard favicon -->
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="favicon.png">
  
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>JERSIFY</title>

  <!-- Google Fonts required by Figma Design Spec -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Krona+One&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&family=Varela+Round&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #ffffff;
      --card-bg: #ffffff;
      --text: #000000;
      --muted: #888888;
      --accent: #c61f2f;
      --line: #e5e5e5;
      --radius-sm: 5px;
      --radius-md: 10px;
      --radius-lg: 20px;
      --radius-pill: 17px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { background: #f5f5f5; color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; }
    a { text-decoration: none; color: inherit; }
    button, input { font: inherit; }

    /* ══ SPLASH ══ */
    #initScreen {
      position: fixed; inset: 0; z-index: 9998; background: #ffffff;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px;
      transition: opacity .45s ease, visibility .45s ease;
    }
    #initScreen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .splash-logo-img { width: clamp(200px, 55vw, 320px); height: auto; object-fit: contain; }
    .splash-bar-wrap { width: 180px; height: 3px; background: rgba(0,0,0,.10); border-radius: 999px; overflow: hidden; }
    .splash-bar { height: 100%; width: 0%; background: var(--text); border-radius: 999px; transition: width .3s ease; }
    .splash-status { font-size: 11px; color: rgba(0,0,0,.4); font-weight: 500; letter-spacing: .5px; }

    /* ══ MAIN CONTAINER (Center aligned max 430px for mobile frame parity) ══ */
    .page {
      width: 100%;
      max-width: 430px;
      margin: 0 auto;
      background: #ffffff;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
      padding-bottom: 90px;
      opacity: 0;
      transition: opacity .4s ease;
      box-shadow: 0 0 30px rgba(0,0,0,.05);
    }
    .page.visible { opacity: 1; }

    /* ── HEADER (Figma Header style) ── */
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 26px 16px 14px 16px; min-height: 64px;
      position: sticky; top: 0;
      background: rgba(255,255,255,.98); backdrop-filter: blur(10px);
      z-index: 40; border-bottom: 1px solid rgba(0,0,0,.05);
    }
    .logo-wrap { display: flex; align-items: center; gap: 8px; cursor: pointer; line-height: 1; margin-top: 15px; }
    .logo-img { height: 44px; width: auto; max-width: 210px; object-fit: contain; display: block; }
    .logo-text-fallback { font-family: 'Krona One', sans-serif; font-size: 24px; letter-spacing: 3px; color: #000; font-weight: 700; line-height: 1; }
    
    .header-actions { display: flex; align-items: center; gap: 10px; height: 44px; }
    .header-btn {
      width: 38px; height: 38px; border: none; border-radius: 50%;
      background: #f2f2f2; color: #111; display: flex; align-items: center; justify-content: center;
      cursor: pointer; position: relative; transition: transform .2s ease; flex-shrink: 0;
    }
    .header-btn:active { transform: scale(0.95); }
    .header-btn svg { width: 18px; height: 18px; }
    .cart-badge {
      position: absolute; top: -3px; right: -3px; width: 16px; height: 16px;
      border-radius: 50%; background: #000; color: #fff; font-size: 9px;
      font-weight: 800; display: none; place-items: center; font-family: 'DM Sans', sans-serif;
    }
    .cart-badge.show { display: grid; }
    .profile-avatar { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
    .profile-initials { font-weight: 800; font-size: 12px; color: #111; }

    /* ── SEARCH BAR (Exact Figma Specs: #f2f2f2, border #d9d9d9, radius 17px) ── */
    .search-section { padding: 12px 11px; display: flex; align-items: center; gap: 8px; }
    .search-box {
      flex: 1; height: 33px; background: #f2f2f2; border: 0.85px solid #d9d9d9;
      border-radius: 17px; display: flex; align-items: center; padding: 0 11px; gap: 8px;
    }
    .search-box svg { width: 14px; height: 14px; color: #999999; flex-shrink: 0; }
    .search-box input {
      border: none; outline: none; background: transparent; width: 100%;
      font-family: 'Inter', sans-serif; font-size: 12px; color: #111;
    }
    .search-box input::placeholder { color: #999999; }
    .filter-btn {
      width: 33px; height: 33px; background: #f2f2f2; border: 0.85px solid #d9d9d9;
      border-radius: 17px; display: grid; place-items: center; cursor: pointer; flex-shrink: 0;
    }
    .filter-btn svg { width: 16px; height: 16px; color: #333333; opacity: 0.7; }

    /* ── HERO BANNER (Figma Specs: height ~450px, radius 20px) ── */
    .hero-container { padding: 0 11px; margin-bottom: 12px; }
    .hero-slider {
      width: 100%; height: 490px; border-radius: 20px; overflow: hidden;
      position: relative; background: #111111;
    }
    .hero-slides { display: flex; height: 100%; transition: transform .5s cubic-bezier(0.25, 1, 0.5, 1); }
    .hero-slide { width: 100%; height: 100%; flex: 0 0 100%; position: relative; cursor: pointer; }
    .hero-slide img, .hero-slide video { width: 100%; height: 100%; object-fit: cover; display: block; }
    .hero-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.18); pointer-events: none; }

    /* Dots indicator overlay on hero images */
    .dots-indicator {
      position: absolute; bottom: 14px; left: 0; right: 0;
      display: flex; justify-content: center; align-items: center; gap: 6px;
      z-index: 10; padding: 0; pointer-events: auto;
    }
    .dot-pill { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.55); border: none; cursor: pointer; transition: all .3s ease; box-shadow: 0 1px 4px rgba(0,0,0,0.3); }
    .dot-pill.active { width: 22px; border-radius: 10px; background: #ffffff; }

    /* ── SECTION TITLES ── */
    .title-ubuntu-bold {
      font-family: 'Ubuntu', sans-serif; font-weight: 700; font-size: 20px;
      line-height: 1.05; color: #000000; text-align: center; text-transform: uppercase;
      margin: 16px 0 16px 0; letter-spacing: 0.5px;
    }
    .title-ubuntu-reg {
      font-family: 'Ubuntu', sans-serif; font-weight: 400; font-size: 20px;
      line-height: 1.05; color: #000000; margin: 24px 11px 14px 11px;
    }
    .brand-krona {
      font-family: 'Krona One', sans-serif; font-size: 18px; color: #000000;
      letter-spacing: 3.6px; text-transform: uppercase; text-align: center;
      margin: 28px 0 20px 0;
    }

    /* ── SHOP BY CLUBS (Circular 61px icons) ── */
    .clubs-scroll-row {
      display: flex; gap: 12px; overflow-x: auto; padding: 10px 14px 22px 14px;
      scrollbar-width: none; -webkit-overflow-scrolling: touch;
    }
    .clubs-scroll-row::-webkit-scrollbar { display: none; }
    .club-badge-circle {
      flex: 0 0 61px; height: 61px; border-radius: 50%;
      background: #ffffff; border: 1.5px solid #ffffff; cursor: pointer;
      box-shadow: 0 5px 15px rgba(0,0,0,0.15), 0 0 10px rgba(0,0,0,0.08);
      filter: drop-shadow(0 3px 6px rgba(0,0,0,0.14));
      transition: transform .2s ease, box-shadow .2s ease;
      display: flex; align-items: center; justify-content: center;
      position: relative;
    }
    .club-badge-circle:active { transform: scale(0.93); }
    .club-badge-circle img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }

    /* ── 2-COLUMN PRODUCT CARDS (Figma Specs: 182px x 278px, radius 5px) ── */
    .product-grid-2col {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 0 11px;
      margin-bottom: 24px;
    }
    .product-card-figma {
      border-radius: 5px; background: #ffffff; overflow: hidden; cursor: pointer;
      display: flex; flex-direction: column; transition: transform .2s ease;
    }
    .product-card-figma:active { transform: scale(0.98); }
    .product-card-figma .pic-wrap {
      width: 100%; height: 260px; border-radius: 5px; overflow: hidden;
      background: #f7f7f7; position: relative;
    }
    .product-card-figma .pic-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .product-card-figma .details { padding: 8px 2px 4px 2px; }
    .product-card-figma .title {
      font-family: 'Varela Round', 'Varela', sans-serif; font-size: 12px;
      color: #000000; line-height: 1.2; margin-bottom: 4px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .product-card-figma .price {
      font-family: 'Varela Round', 'Varela', sans-serif; font-size: 14px;
      font-weight: 400; color: #000000;
    }

    /* ── MID BANNER (Figma spec height 222px) ── */
    .mid-banner-container { padding: 0 11px; margin-bottom: 12px; }
    .mid-banner {
      width: 100%; height: 220px; border-radius: 10px; overflow: hidden;
      position: relative; background: #111;
    }
    .mid-banner img, .mid-banner video { width: 100%; height: 100%; object-fit: cover; display: block; }

    /* ── SHOP BY CATEGORY (2x2 Grid with Krona One dark overlay) ── */
    .category-grid-2col {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 0 11px;
      margin-bottom: 24px;
    }
    .category-card-figma {
      height: 260px; border-radius: 5px; overflow: hidden; position: relative;
      cursor: pointer; box-shadow: 0px 4px 4px rgba(0,0,0,0.25); background: #111111;
    }
    .category-card-figma img, .category-card-figma video { width: 100%; height: 100%; object-fit: cover; display: block; }
    .category-overlay-bar {
      position: absolute; bottom: 0; left: 0; right: 0; height: 31px;
      background: rgba(0,0,0,0.5); border-radius: 5px; display: flex;
      align-items: center; justify-content: center;
    }
    .category-overlay-title {
      font-family: 'Krona One', sans-serif; font-size: 18px; color: #ffffff;
      letter-spacing: 3.6px; text-transform: uppercase; white-space: nowrap;
    }

    /* ── SECONDARY PROMO BANNER (Figma spec 245px height) ── */
    .secondary-banner-container { padding: 0 11px; margin-bottom: 24px; }
    .secondary-banner {
      width: 100%; height: 245px; border-radius: 10px; overflow: hidden;
      position: relative; background: #111;
    }
    .secondary-banner img, .secondary-banner video { width: 100%; height: 100%; object-fit: cover; display: block; }

    /* ── FOOTER ("Get in touch" & "Meet the Team" Figma node 65:22) ── */
    .footer-figma {
      background: #000000; color: #ffffff; padding: 28px 16px 36px 16px;
      margin-top: 32px; border-top-left-radius: 16px; border-top-right-radius: 16px;
    }
    .footer-heading {
      font-family: 'Krona One', sans-serif; font-size: 14px; color: #ffffff;
      letter-spacing: 1.4px; text-transform: uppercase; margin-bottom: 16px;
    }
    .contact-list { display: flex; flex-direction: column; gap: 14px; margin-bottom: 32px; }
    .contact-row { display: flex; align-items: center; gap: 14px; }
    .contact-row svg { width: 24px; height: 24px; color: #ffffff; flex-shrink: 0; }
    .contact-row span {
      font-family: 'DM Sans', sans-serif; font-size: 14px; color: #ffffff;
      letter-spacing: 1.4px;
    }

    .team-section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .team-section-header svg { width: 24px; height: 24px; color: #ffffff; }

    .team-grid-4col { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 24px; }
    .team-member-card { display: flex; flex-direction: column; align-items: center; }
    .team-member-avatar {
      width: 100%; aspect-ratio: 69/71; border-radius: 7px; overflow: hidden;
      background: #222222; border: 1px solid rgba(255,255,255,0.1); margin-bottom: 6px;
    }
    .team-member-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .team-member-role {
      font-family: 'DM Sans', sans-serif; font-size: 10px; color: #ffffff;
      letter-spacing: 1px; text-align: center; text-transform: capitalize;
    }

    .footer-brand-link {
      font-family: 'DM Sans', sans-serif; font-size: 14px; color: #ffffff;
      letter-spacing: 1.4px; text-align: center; margin-top: 24px; opacity: 0.9;
    }

    /* ── FIXED BOTTOM NAVIGATION ── */
    .bottom-nav {
      position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 430px; background: rgba(255,255,255,0.96);
      backdrop-filter: blur(12px); border-top: 1px solid rgba(0,0,0,0.06);
      display: flex; justify-content: space-around; padding: 10px 0 12px 0;
      z-index: 50;
    }
    .nav-item {
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      font-size: 10px; color: #666666; font-weight: 500; min-width: 60px;
    }
    .nav-item svg { width: 20px; height: 20px; }
    .nav-item.active { color: #000000; font-weight: 800; }

    /* Skeleton shimmer */
    .skeleton-box {
      background: linear-gradient(90deg, #eeeeee 25%, #e2e2e2 50%, #eeeeee 75%);
      background-size: 200% 100%; animation: shimmer 1.5s infinite;
    }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  </style>
</head>

<body>

  <!-- ══ SPLASH SCREEN ══ -->
  <div id="initScreen">

  <!-- ══ MAIN MOBILE FRAME CONTAINER ══ -->

    <!-- HERO CAROUSEL -->

    <!-- SHOP BY CLUBS SECTION -->

    <!-- BRAND HEADING -->

    <!-- MORE PRODUCTS GRID -->

  <!-- ══ PAGE INTERACTION & DATA BINDING SCRIPT ══ -->
  <script>
    const splashBar    = document.getElementById("splashBar");
    const splashStatus = document.getElementById("splashStatus");
    const initScreen   = document.getElementById("initScreen");
    const mainPage     = document.getElementById("mainPage");

    function goToProduct(pid) { if (pid) window.location.href = "shop.html?product=" + encodeURIComponent(pid); }
    function goToTeam(teamId) { if (teamId) window.location.href = "team.html?id=" + encodeURIComponent(teamId); }

    let _progress = 0;
    function setProgress(pct, label) {
      _progress = Math.max(_progress, pct);
      splashBar.style.width = _progress + "%";
      if (label) splashStatus.textContent = label;
    }
    function revealPage() {
      setProgress(100, "Ready!");
      setTimeout(() => { initScreen.classList.add("hidden"); mainPage.classList.add("visible"); }, 300);
    }
    const splashTimeout = setTimeout(revealPage, 5000);

    /* CLUB BADGES POPULATE */
    (() => {
      const clubs = [
        { name: "Barcelona",  id: "barcelona",   img: "https://firebasestorage.googleapis.com/v0/b/jersify-f9b5e.firebasestorage.app/o/clubs%2FIMG_3654.PNG?alt=media&token=37bd457b-2dbf-4bcc-aa09-7321910532ab" },
        { name: "Real Madrid", id: "real-madrid", img: "https://firebasestorage.googleapis.com/v0/b/jersify-f9b5e.firebasestorage.app/o/clubs%2FIMG_3655.PNG?alt=media&token=26d03bfd-4d7f-48cc-89ed-cffdd7374a5b" },
        { name: "Arsenal",    id: "arsenal",     img: "https://firebasestorage.googleapis.com/v0/b/jersify-f9b5e.firebasestorage.app/o/clubs%2FIMG_3660.PNG?alt=media&token=8c170800-ec6b-421f-94ba-f15dc50a0bee" },
        { name: "Man City",   id: "man-city",    img: "https://firebasestorage.googleapis.com/v0/b/jersify-f9b5e.firebasestorage.app/o/clubs%2Fmanchestar.PNG?alt=media&token=4b7fe8f5-b314-4ebe-892f-ccdab713b3d7" },
        { name: "Man Utd",    id: "man-utd",     img: "https://firebasestorage.googleapis.com/v0/b/jersify-f9b5e.firebasestorage.app/o/clubs%2FIMG_3657.PNG?alt=media&token=9fc94827-aaec-46cd-a301-a1bfcc03576b" },
        { name: "Chelsea",    id: "chelsea",     img: "https://firebasestorage.googleapis.com/v0/b/jersify-f9b5e.firebasestorage.app/o/clubs%2FIMG_3659.PNG?alt=media&token=ec3f7d57-8ca9-42cf-adc3-ae1f4c00408a" },
        { name: "PSG",        id: "psg",         img: "https://firebasestorage.googleapis.com/v0/b/jersify-f9b5e.firebasestorage.app/o/clubs%2Fpsg%20300x300.webp?alt=media&token=d3b49bce-9b4a-486c-8aed-7417a896bfd6" },
        { name: "Liverpool",  id: "liverpool",   img: "https://firebasestorage.googleapis.com/v0/b/jersify-f9b5e.firebasestorage.app/o/clubs%2FIMG_3656.PNG?alt=media&token=15b830b7-3943-45bf-b7fe-c4c542f58ea9" }
      ];
      const row = document.getElementById("clubsRow");
      row.innerHTML = clubs.map(c => `
        <div class="club-badge-circle" onclick="goToTeam('${c.id}')" title="${c.name}">
          <img src="${c.img}" alt="${c.name}" loading="lazy" />
        </div>
      `).join("");
    })();

    /* HERO CAROUSEL INTERACTION */
    let heroIndex = 0, heroTimer, heroTotal = 0;
    function buildDots(count) {
      const dotsWrap = document.getElementById("heroDots");
      dotsWrap.innerHTML = "";
      for (let i = 0; i < count; i++) {
        const btn = document.createElement("button");
        btn.className = "dot-pill" + (i === 0 ? " active" : "");
        btn.addEventListener("click", () => showHeroSlide(i));
        dotsWrap.appendChild(btn);
      }
    }
    function showHeroSlide(i) {
      heroIndex = i;
      document.getElementById("heroSlides").style.transform = `translateX(-${i * 100}%)`;
      document.querySelectorAll("#heroDots .dot-pill").forEach((d, idx) => d.classList.toggle("active", idx === i));
    }
    function nextHeroSlide() { if (heroTotal) { heroIndex = (heroIndex + 1) % heroTotal; showHeroSlide(heroIndex); } }
    function startHeroTimer() { clearInterval(heroTimer); if (heroTotal > 1) heroTimer = setInterval(nextHeroSlide, 4000); }

    /* SEARCH INPUT */
    const searchInput = document.getElementById("searchInput");
    searchInput.addEventListener("keydown", e => {
      if (e.key === "Enter" && searchInput.value.trim()) {
        window.location.href = `shop.html?q=${encodeURIComponent(searchInput.value.trim())}`;
      }
    });
  </script>

  <!-- ══ FIREBASE RTDB MODULE BINDING ══ -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA4O7ROp8srleiFAZSmiyd6ml7Ruv8eN74",
      authDomain: "jersify-f9b5e.firebaseapp.com",
      projectId: "jersify-f9b5e",
      storageBucket: "jersify-f9b5e.firebasestorage.app",
      messagingSenderId: "461181023878",
      appId: "1:461181023878:web:6ebfbae603baf4a873c307",
      databaseURL: "https://jersify-f9b5e-default-rtdb.firebaseio.com"
    };

    const app  = initializeApp(firebaseConfig);
    const rtdb = getDatabase(app);
    const auth = getAuth(app);

    function isVideoUrl(url) {
      return /\.(mp4|mov|webm|ogg|avi|mkv)(\?|$)/i.test(url || "");
    }

    /* AUTH LISTENER */
    onAuthStateChanged(auth, async user => {
      const cartBadge  = document.getElementById("cartBadge");
      const profileBtn = document.getElementById("profileBtn");
      const profileIcon= document.getElementById("profileIcon");
      
      function updateBadge(n) {
        if (n > 0) { cartBadge.textContent = n > 9 ? "9+" : n; cartBadge.classList.add("show"); }
      }

      if (user) {
        if (user.photoURL) {
          profileIcon.style.display = "none";
          const img = document.createElement("img");
          img.src = user.photoURL; img.className = "profile-avatar"; img.alt = "Profile";
          profileBtn.appendChild(img);
        }
        try {
          const snap = await get(ref(rtdb, `users/${user.uid}/cart`));
          let n = 0; if (snap.exists()) snap.forEach(() => n++);
          updateBadge(n || JSON.parse(localStorage.getItem("jersify_cart") || "[]").length);
        } catch { updateBadge(JSON.parse(localStorage.getItem("jersify_cart") || "[]").length); }
      } else {
        updateBadge(JSON.parse(localStorage.getItem("jersify_cart") || "[]").length);
      }
    });

    /* HEROES LOAD */
    async function loadHeroes() {
      setProgress(20, "Loading Hero Slides…");
      try {
        const snap = await get(ref(rtdb, "indexMedia"));
        if (!snap.exists()) return;
        let heroes = [];
        snap.forEach(d => { const v = d.val(); if (v.section === "hero") heroes.push(v); });
        heroes = heroes.filter(h => (h.mediaUrl || h.imgUrl)).sort((a, b) => (a.order||0) - (b.order||0));
        if (!heroes.length) return;

        const slidesEl = document.getElementById("heroSlides");
        slidesEl.innerHTML = heroes.map(h => {
          const url = h.mediaUrl || h.imgUrl, link = h.link || "shop.html";
          const isVid = h.mediaType === "video" || isVideoUrl(url);
          const media = isVid
            ? `<video src="${url}" autoplay muted loop playsinline></video>`
            : `<img src="${url}" alt="Hero" loading="eager" />`;
          return `<div class="hero-slide" onclick="window.location.href='${link}'">${media}</div>`;
        }).join("");

        heroTotal = heroes.length;
        buildDots(heroTotal);
        showHeroSlide(0);
        startHeroTimer();
      } catch (e) { console.warn("Hero fetch failed", e); }
    }

    /* PRODUCTS LOAD (Render into Figma 2-col grids) */
    async function loadProducts() {
      setProgress(50, "Loading Jerseys…");
      const featuredGrid = document.getElementById("featuredProductsGrid");
      const moreGrid     = document.getElementById("moreProductsGrid");
      try {
        const snap = await get(ref(rtdb, "products"));
        if (!snap.exists()) {
          featuredGrid.innerHTML = moreGrid.innerHTML = `<div style="padding:20px;grid-column:span 2;text-align:center;color:#888;">No jerseys listed.</div>`;
          return;
        }
        let products = [];
        snap.forEach(d => { const p = d.val(); p._id = d.key; if (!p.status || p.status === "active") products.push(p); });

        function createCard(p) {
          const name  = p.name || "FC Barcelona Home 2026-27";
          const price = p.price ? `₹ ${p.price}` : "₹ 800";
          const img   = p.imgUrl || "https://images.unsplash.com/photo-1508098682722-e99c43a406b2?q=80&w=600&auto=format&fit=crop";
          return `
            <div class="product-card-figma" onclick="goToProduct('${p._id}')">
              <div class="pic-wrap">
                <img src="${img}" alt="${name}" loading="lazy" />
              </div>
              <div class="details">
                <div class="title">${name}</div>
                <div class="price">${price}</div>
              </div>
            </div>
          `;
        }

        const featuredItems = products.slice(0, 2);
        const remainingItems= products.slice(2, 8);

        if (featuredItems.length) {
          featuredGrid.innerHTML = featuredItems.map(p => createCard(p)).join("");
        } else {
          featuredGrid.innerHTML = `<div style="padding:20px;grid-column:span 2;text-align:center;color:#888;">No featured jerseys available.</div>`;
        }

        if (remainingItems.length) {
          moreGrid.innerHTML = remainingItems.map(p => createCard(p)).join("");
        } else if (products.length <= 4) {
          moreGrid.style.display = "none";
        }
      } catch (e) {
        console.error("Products load failed", e);
      }
    }

    /* INDEX MEDIA LOAD (Mid Banner & Secondary Banner) */
    async function loadIndexMedia() {
      setProgress(80, "Loading Featured Media…");
      const midBanner       = document.getElementById("midBanner");
      const secondaryBanner = document.getElementById("secondaryBanner");
      try {
        const snap = await get(ref(rtdb, "indexMedia"));
        if (!snap.exists()) return;
        let items = [];
        snap.forEach(d => { const v = d.val(); items.push(v); });
        const featured = items.filter(m => m.section === "featured" && (m.mediaUrl || m.imgUrl));

        if (featured[0]) {
          const url = featured[0].mediaUrl || featured[0].imgUrl;
          const link= featured[0].link || "shop.html";
          const isVid = featured[0].mediaType === "video" || isVideoUrl(url);
          midBanner.innerHTML = isVid
            ? `<video src="${url}" autoplay muted loop playsinline onclick="window.location.href='${link}'" style="cursor:pointer;"></video>`
            : `<img src="${url}" alt="Mid Banner" onclick="window.location.href='${link}'" style="cursor:pointer;" />`;
        } else {
          midBanner.innerHTML = `<img src="https://images.unsplash.com/photo-1577223625816-7546f13df25d?q=80&w=800&auto=format&fit=crop" alt="Mid Banner" />`;
        }

        if (featured[1]) {
          const url = featured[1].mediaUrl || featured[1].imgUrl;
          const link= featured[1].link || "shop.html";
          const isVid = featured[1].mediaType === "video" || isVideoUrl(url);
          secondaryBanner.innerHTML = isVid
            ? `<video src="${url}" autoplay muted loop playsinline onclick="window.location.href='${link}'" style="cursor:pointer;"></video>`
            : `<img src="${url}" alt="Secondary Banner" onclick="window.location.href='${link}'" style="cursor:pointer;" />`;
        } else {
          secondaryBanner.innerHTML = `<img src="https://images.unsplash.com/photo-1508098682722-e99c43a406b2?q=80&w=800&auto=format&fit=crop" alt="Secondary Banner" />`;
        }
      } catch (e) {
        console.error("Index media load failed", e);
      }
    }

    async function init() {
      setProgress(10, "Connecting to Firebase…");
      await Promise.allSettled([loadHeroes(), loadProducts(), loadIndexMedia()]);
      clearTimeout(splashTimeout);
      revealPage();
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", init);
    } else {
      init();
    }
  </script>
