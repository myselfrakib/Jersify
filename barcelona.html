<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="favicon.png">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JERSIFY – FC Barcelona</title>

  <!-- Google Fonts required by Figma Design Spec (Node 69:46) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Krona+One&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&family=Varela+Round&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #ffffff;
      --card-bg: #ffffff;
      --text: #000000;
      --muted: #888888;
      --accent: #c61f2f;
      --line: #e5e5e5;
      --radius-lg: 20px;
      --radius-sm: 5px;
      --radius-pill: 17px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { background: #f5f5f5; color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; }
    a { text-decoration: none; color: inherit; }
    button, input { font: inherit; }

    /* ══ MAIN CONTAINER (Center aligned max 430px for mobile frame parity) ══ */
    .page {
      width: 100%;
      max-width: 430px;
      margin: 0 auto;
      background: #ffffff;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
      padding-bottom: 90px;
      box-shadow: 0 0 30px rgba(0,0,0,.05);
    }

    /* ── HEADER ── */
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 16px;
      position: sticky; top: 0;
      background: rgba(255,255,255,.98); backdrop-filter: blur(10px);
      z-index: 40; border-bottom: 1px solid rgba(0,0,0,.05);
    }
    .logo-wrap { display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .logo-img { height: 36px; width: auto; max-width: 150px; object-fit: contain; }
    .logo-text-fallback { font-family: 'Krona One', sans-serif; font-size: 20px; letter-spacing: 2px; color: #000; }
    
    .header-actions { display: flex; align-items: center; gap: 10px; }
    .header-btn {
      width: 36px; height: 36px; border: none; border-radius: 50%;
      background: #f2f2f2; color: #111; display: grid; place-items: center;
      cursor: pointer; position: relative; transition: transform .2s ease;
    }
    .header-btn:active { transform: scale(0.95); }
    .header-btn svg { width: 18px; height: 18px; }
    .cart-badge {
      position: absolute; top: -3px; right: -3px; width: 16px; height: 16px;
      border-radius: 50%; background: #000; color: #fff; font-size: 9px;
      font-weight: 800; display: none; place-items: center; font-family: 'DM Sans', sans-serif;
    }
    .cart-badge.show { display: grid; }

    /* ── SEARCH BAR (Exact Figma Specs: #f2f2f2, border #d9d9d9, radius 17px) ── */
    .search-section { padding: 12px 11px; display: flex; align-items: center; gap: 8px; }
    .search-box {
      flex: 1; height: 33px; background: #f2f2f2; border: 0.85px solid #d9d9d9;
      border-radius: 17px; display: flex; align-items: center; padding: 0 11px; gap: 8px;
    }
    .search-box svg { width: 14px; height: 14px; color: #999999; flex-shrink: 0; }
    .search-box input {
      border: none; outline: none; background: transparent; width: 100%;
      font-family: 'Inter', sans-serif; font-size: 12px; color: #111;
    }
    .search-box input::placeholder { color: #999999; }
    .filter-btn {
      width: 33px; height: 33px; background: #f2f2f2; border: 0.85px solid #d9d9d9;
      border-radius: 17px; display: grid; place-items: center; cursor: pointer; flex-shrink: 0;
    }
    .filter-btn svg { width: 16px; height: 16px; color: #333333; opacity: 0.7; }

    /* ── CLUB CREST HERO BANNER (Figma Spec Node 69:48 - 370px x 370px, radius 20px) ── */
    .club-hero-container { padding: 0 11px; margin-bottom: 16px; }
    .club-hero-card {
      width: 100%; aspect-ratio: 1/1; max-height: 370px; border-radius: 20px;
      overflow: hidden; position: relative; background: #090557; display: grid;
      place-items: center;
    }
    .club-hero-card img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .club-hero-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.18); pointer-events: none; }

    /* Team Title & Shop Now Action */
    .club-title-krona {
      font-family: 'Krona One', sans-serif; font-size: 20px; color: #090557;
      line-height: 1.05; text-align: center; text-transform: uppercase;
      margin: 16px 0 12px 0; letter-spacing: 0.5px;
    }
    .shop-now-btn {
      width: 131px; height: 37px; background: #000000; color: #ffffff;
      font-family: 'Ubuntu', sans-serif; font-weight: 700; font-size: 16px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 24px auto; cursor: pointer; border: none;
      transition: transform .2s ease; text-transform: uppercase;
    }
    .shop-now-btn:active { transform: scale(0.96); }

    /* ── SECTION TITLES ── */
    .title-ubuntu-reg {
      font-family: 'Ubuntu', sans-serif; font-weight: 400; font-size: 20px;
      line-height: 1.05; color: #000000; margin: 24px 11px 14px 11px;
    }

    /* ── 2-COLUMN PRODUCT CARDS (Figma Specs: 182px x 278px, radius 5px) ── */
    .product-grid-2col {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 0 11px;
      margin-bottom: 24px;
    }
    .product-card-figma {
      border-radius: 5px; background: #ffffff; overflow: hidden; cursor: pointer;
      display: flex; flex-direction: column; transition: transform .2s ease;
    }
    .product-card-figma:active { transform: scale(0.98); }
    .product-card-figma .pic-wrap {
      width: 100%; height: 260px; border-radius: 5px; overflow: hidden;
      background: #f7f7f7; position: relative;
    }
    .product-card-figma .pic-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .product-card-figma .details { padding: 8px 2px 4px 2px; }
    .product-card-figma .title {
      font-family: 'Varela Round', 'Varela', sans-serif; font-size: 12px;
      color: #000000; line-height: 1.2; margin-bottom: 4px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .product-card-figma .price {
      font-family: 'Varela Round', 'Varela', sans-serif; font-size: 14px;
      font-weight: 400; color: #000000;
    }

    /* ── FIXED BOTTOM NAVIGATION ── */
    .bottom-nav {
      position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 430px; background: #000000;
      display: flex; justify-content: space-around; padding: 12px 0 14px 0;
      z-index: 50; color: #ffffff;
    }
    .nav-item {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      font-size: 10px; color: #ffffff; font-weight: 600; min-width: 60px;
      font-family: 'Inter', sans-serif;
    }
    .nav-item svg { width: 20px; height: 20px; }

    /* Skeleton Shimmer */
    .skeleton-box {
      background: linear-gradient(90deg, #eeeeee 25%, #e2e2e2 50%, #eeeeee 75%);
      background-size: 200% 100%; animation: shimmer 1.5s infinite;
    }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  </style>
</head>

<body>

  <!-- ══ MAIN MOBILE CONTAINER ══ -->
  <div class="page">

    <!-- TOPBAR -->
    <header class="topbar">
      <div class="logo-wrap" onclick="window.location.href='index.html'">
        <img class="logo-img" src="https://firebasestorage.googleapis.com/v0/b/jersify-f9b5e.firebasestorage.app/o/IMG-20260524-WA0002.webp?alt=media&token=22cbac50-3216-4154-a3f0-f666d79b94d3" alt="Jersify" onerror="this.style.display='none';document.getElementById('logoTextFallback').style.display='block';" />
        <div id="logoTextFallback" class="logo-text-fallback" style="display:none;">JERSIFY</div>
      </div>
      <div class="header-actions">
        <button class="header-btn" aria-label="Cart" onclick="window.location.href='checkout.html'">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="20" r="1"></circle><circle cx="17" cy="20" r="1"></circle><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h8.7a2 2 0 0 0 2-1.5L23 6H6"></path></svg>
          <span class="cart-badge" id="cartBadge"></span>
        </button>
      </div>
    </header>

    <!-- SEARCH BAR SECTION -->
    <section class="search-section">
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><path d="M21 21l-4.3-4.3"></path></svg>
        <input type="text" id="searchInput" placeholder="Search..." />
      </div>
      <button class="filter-btn" aria-label="Filter" onclick="window.location.href='shop.html'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 21v-7"/><path d="M4 10V3"/><path d="M12 21v-9"/><path d="M12 8V3"/><path d="M20 21v-5"/><path d="M20 12V3"/><path d="M1 14h6"/><path d="M9 8h6"/><path d="M17 16h6"/></svg>
      </button>
    </section>

    <!-- CLUB CREST HERO BANNER -->
    <section class="club-hero-container">
      <div class="club-hero-card" id="clubHeroCard">
        <img id="clubHeroImg" src="https://firebasestorage.googleapis.com/v0/b/jersify-f9b5e.firebasestorage.app/o/clubs%2FIMG_3654.PNG?alt=media&token=37bd457b-2dbf-4bcc-aa09-7321910532ab" alt="FC Barcelona" />
        <div class="club-hero-overlay"></div>
      </div>
    </section>

    <!-- TEAM TITLE & ACTION -->
    <h1 class="club-title-krona">FC BARCELONA</h1>
    <button class="shop-now-btn" onclick="window.location.href='shop.html?team=barcelona'">SHOP NOW</button>

    <!-- SECTION 1: 2026-27 JERSEYS -->
    <section>
      <h2 class="title-ubuntu-reg">2026-27 Jerseys</h2>
      <div class="product-grid-2col" id="teamJerseysGrid">
        <div class="product-card-figma skeleton-box" style="height: 280px;"></div>
        <div class="product-card-figma skeleton-box" style="height: 280px;"></div>
      </div>
    </section>

    <!-- SECTION 2: SPECIAL FOR YOU -->
    <section>
      <h2 class="title-ubuntu-reg">Special For You</h2>
      <div class="product-grid-2col" id="specialGrid">
        <div class="product-card-figma skeleton-box" style="height: 280px;"></div>
        <div class="product-card-figma skeleton-box" style="height: 280px;"></div>
      </div>
    </section>

  </div>

  <!-- FIXED BOTTOM NAVIGATION BAR -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l9-9 9 9"/><path d="M5 10v10h14V10"/></svg>
      <div>Home</div>
    </a>
    <a href="shop.html" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
      <div>Category</div>
    </a>
    <a href="checkout.html" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
      <div>Cart</div>
    </a>
    <a href="profile.html" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <div>Profile</div>
    </a>
  </nav>

  <!-- ══ SCRIPT & FIREBASE DATA BINDING ══ -->
  <script>
    const searchInput = document.getElementById("searchInput");
    searchInput.addEventListener("keydown", e => {
      if (e.key === "Enter" && searchInput.value.trim()) {
        window.location.href = `shop.html?q=${encodeURIComponent(searchInput.value.trim())}`;
      }
    });
  </script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA4O7ROp8srleiFAZSmiyd6ml7Ruv8eN74",
      authDomain: "jersify-f9b5e.firebaseapp.com",
      projectId: "jersify-f9b5e",
      storageBucket: "jersify-f9b5e.firebasestorage.app",
      messagingSenderId: "461181023878",
      appId: "1:461181023878:web:6ebfbae603baf4a873c307",
      databaseURL: "https://jersify-f9b5e-default-rtdb.firebaseio.com"
    };

    const app  = initializeApp(firebaseConfig);
    const rtdb = getDatabase(app);
    const auth = getAuth(app);

    onAuthStateChanged(auth, user => {
      const cartBadge = document.getElementById("cartBadge");
      function updateBadge(n) { if (n > 0) { cartBadge.textContent = n > 9 ? "9+" : n; cartBadge.classList.add("show"); } }
      updateBadge(JSON.parse(localStorage.getItem("jersify_cart") || "[]").length);
    });

    async function loadBarcelonaProducts() {
      const jerseysGrid = document.getElementById("teamJerseysGrid");
      const specialGrid = document.getElementById("specialGrid");

      try {
        const snap = await get(ref(rtdb, "products"));
        if (!snap.exists()) return;
        let products = [];
        snap.forEach(d => { const p = d.val(); p._id = d.key; products.push(p); });

        let barcaProducts = products.filter(p => {
          const t = (p.team || p.name || "").toString().toLowerCase();
          return t.includes("barcelona") || t.includes("barca");
        });

        if (!barcaProducts.length) barcaProducts = products.slice(0, 4);

        function createCard(p) {
          const name  = p.name || "FC Barcelona Home 2026-27";
          const price = p.price ? `₹ ${p.price}` : "₹ 800";
          const img   = p.imgUrl || "https://images.unsplash.com/photo-1508098682722-e99c43a406b2?q=80&w=600&auto=format&fit=crop";
          return `
            <div class="product-card-figma" onclick="window.location.href='shop.html?product=${p._id}'">
              <div class="pic-wrap">
                <img src="${img}" alt="${name}" loading="lazy" />
              </div>
              <div class="details">
                <div class="title">${name}</div>
                <div class="price">${price}</div>
              </div>
            </div>
          `;
        }

        jerseysGrid.innerHTML = barcaProducts.slice(0, 2).map(p => createCard(p)).join("");
        specialGrid.innerHTML = (barcaProducts.length > 2 ? barcaProducts.slice(2, 4) : products.slice(2, 4)).map(p => createCard(p)).join("");
      } catch (e) { console.error("Barcelona products fetch failed", e); }
    }
    loadBarcelonaProducts();
  </script>
</body>
</html>
